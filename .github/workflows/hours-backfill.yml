name: Hours backfill (Google Places)

# SCHEDULE DISABLED 2026-08-08 — this job published hours from the wrong
# businesses, and would keep doing so.
#
# It was `cron: "0 14 5 * *"` (14:00 UTC on the 5th).
#
# The defect is the interaction with the place ids, not this script's own logic.
# candor-nppes/enrich_places.py scores each Text Search match and below its 0.50
# accept floor withholds the coordinates, rating and review count — but still
# records the candidate `google_place_id`, which was loaded into Supabase. This
# job selects on `google_place_id IS NOT NULL`, which silently readmitted every
# match enrich_places had rejected, fetched Place Details for the wrong business
# and wrote its opening hours onto the clinic's public profile.
#
# Measured 2026-08-08: 2,094 clinics (31% of all published hours) were affected,
# e.g. BUCK HEALTHCARE LLC showing hours from "MIND 24-7", and ANESTHESIA
# MANAGEMENT GROUP OF NORTH ALABAMA showing hours from "Anesthesia Associates of
# East Alabama". 858 more were queued for the same treatment on the next run.
#
# scripts/clear_low_confidence_matches.py removes those hours and the place ids
# that caused them. Once it has run, the affected clinics drop out of this
# queue by construction, because their place id is NULL.
#
# BEFORE RE-ENABLING: this job trusts `google_place_id` implicitly. Either be
# certain every stored place id came from a match scored >= 0.50, or have this
# script verify provenance itself. Restoring the cron without that check will
# re-publish wrong hours for any sub-threshold place id that gets written later.
#
# BILLING, unchanged and still true (confirmed by the July 2026 $47.68 charge):
# regularOpeningHours bills as Place Details ENTERPRISE, not Pro — ~1,000 free
# calls/month, SHARED with the website backfill. 200 here + 700 there keeps both
# free. Raise deliberately: ~$20/1,000 beyond free.
#
# Manual dispatch stays available for a deliberate, reviewed run.
on:
  workflow_dispatch:
    # Adds a "Run workflow" button in the Actions tab. Use it to run the first
    # batch now, on demand.
    inputs:
      limit:
        description: "Max Google calls this run (Enterprise SKU — ~1,000 free/month SHARED with website backfill, then $20/1,000)"
        type: string
        default: "200"
      dry_run:
        description: "Dry run (count only — no Google calls, no writes)"
        type: boolean
        default: false

jobs:
  backfill:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - run: pip install requests

      # Persist the Places response cache between monthly runs so clinics that
      # Google has no hours for are remembered and never re-billed. Rolling key:
      # restore the most recent cache, save a fresh one after each run.
      - name: Restore Places hours cache
        uses: actions/cache@v4
        with:
          path: scripts/places_hours_cache
          key: places-hours-cache-${{ github.run_id }}
          restore-keys: |
            places-hours-cache-

      - name: Backfill hours
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          GOOGLE_MAPS_API_KEY: ${{ secrets.GOOGLE_MAPS_API_KEY }}
          CLOUDFLARE_DEPLOY_HOOK: ${{ secrets.CLOUDFLARE_DEPLOY_HOOK }}
          # On a scheduled run, inputs.limit is empty, so it falls back to 450
          # (Enterprise free tier is ~1,000/mo shared with the website backfill).
          LIMIT: ${{ inputs.limit || '200' }}
          DRY_RUN: ${{ inputs.dry_run && '1' || '' }}
        run: python scripts/backfill_hours.py
