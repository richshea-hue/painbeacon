name: Hours backfill (Google Places)

on:
  schedule:
    # 14:00 UTC on the 5th of every month. After Google's monthly free-tier
    # reset (the 1st) and before the NPPES sync (the 10th).
    #
    # BILLING (confirmed in the July 2026 billing report — the $47.68 charge):
    # regularOpeningHours bills as Place Details ENTERPRISE, not Pro. The
    # Enterprise free tier is only ~1,000 calls/month, SHARED with the website
    # backfill that runs on the 6th. Defaults are 450 here + 450 there so the
    # two runs together stay free. Raise deliberately: ~$20/1,000 beyond free.
    - cron: "0 14 5 * *"
  workflow_dispatch:
    # Adds a "Run workflow" button in the Actions tab. Use it to run the first
    # batch now, on demand.
    inputs:
      limit:
        description: "Max Google calls this run (Enterprise SKU — ~1,000 free/month SHARED with website backfill, then $20/1,000)"
        type: string
        default: "450"
      dry_run:
        description: "Dry run (count only — no Google calls, no writes)"
        type: boolean
        default: false

jobs:
  backfill:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - run: pip install requests

      # Persist the Places response cache between monthly runs so clinics that
      # Google has no hours for are remembered and never re-billed. Rolling key:
      # restore the most recent cache, save a fresh one after each run.
      - name: Restore Places hours cache
        uses: actions/cache@v4
        with:
          path: scripts/places_hours_cache
          key: places-hours-cache-${{ github.run_id }}
          restore-keys: |
            places-hours-cache-

      - name: Backfill hours
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          GOOGLE_MAPS_API_KEY: ${{ secrets.GOOGLE_MAPS_API_KEY }}
          CLOUDFLARE_DEPLOY_HOOK: ${{ secrets.CLOUDFLARE_DEPLOY_HOOK }}
          # On a scheduled run, inputs.limit is empty, so it falls back to 450
          # (Enterprise free tier is ~1,000/mo shared with the website backfill).
          LIMIT: ${{ inputs.limit || '450' }}
          DRY_RUN: ${{ inputs.dry_run && '1' || '' }}
        run: python scripts/backfill_hours.py
