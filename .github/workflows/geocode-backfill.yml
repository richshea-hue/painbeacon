name: Geocode backfill (Google Places)

# SCHEDULE DISABLED 2026-08-06 — this job is unsafe on the current backlog.
#
# It was `cron: "0 15 8 * *"` (15:00 UTC on the 8th). Quota was never the
# problem: Text Search Pro has 5,000 free/month and nothing else uses that pool.
# Data quality is. Every one of the 3,032 clinics now in its queue was already
# tried by candor-nppes/enrich_places.py with a BYTE-IDENTICAL query string
# ("{name}, {address_1}, {city}, {STATE} {zip5}") against the same endpoint:
#
#   low_confidence (Google returned a place, name overlap too weak)  2,879
#   no_result      (Google returned nothing)                           143
#   matched but pinned outside the clinic's state                       10
#
# `places_lookup()` in backfill_geocodes.py does NO name scoring — it takes the
# FIRST result and validates only in_state(). So a scheduled run would write
# ~2,889 matches a scorer had already rejected, including a place_id, which then
# feeds backfill_hours.py and backfill_websites.py → another practice's hours and
# website published on that clinic's public profile. The Safe Browsing gate does
# not catch a wrong-but-legitimate site. This is plausibly what produced the
# errant locations fix_errant_locations.py exists to clean up.
#
# Use geocode-addresses.yml instead: map pins need an address geocoded, not a
# business matched, and that path writes no place_id so it cannot contaminate the
# enrichment queues. Before re-enabling this schedule, port enrich_places.py's
# confidence scorer into places_lookup() — on today's backlog a correct scorer
# would write almost nothing, because the same query already scored these <0.50.
#
# Manual dispatch is still available for a deliberate, reviewed run.
on:
  workflow_dispatch:
    inputs:
      limit:
        description: "Max Google calls this run (Text Search Pro — 5,000 free/month, separate from the hours/websites pool, then $32/1,000)"
        type: string
        default: "4000"
      dry_run:
        description: "Dry run (count the backlog only — no Google calls, no writes)"
        type: boolean
        default: false

jobs:
  backfill:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - run: pip install requests

      - name: Backfill geocodes
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          GOOGLE_MAPS_API_KEY: ${{ secrets.GOOGLE_MAPS_API_KEY }}
          CLOUDFLARE_DEPLOY_HOOK: ${{ secrets.CLOUDFLARE_DEPLOY_HOOK }}
          # On a scheduled run inputs.limit is empty, so it falls back to 4000.
          LIMIT: ${{ inputs.limit || '4000' }}
          DRY_RUN: ${{ inputs.dry_run && '1' || '' }}
        run: python scripts/backfill_geocodes.py
