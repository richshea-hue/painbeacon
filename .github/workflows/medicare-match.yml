name: Medicare Enrollment Match

on:
  schedule:
    # 14:00 UTC on the 20th of Jan/Apr/Jul/Oct — a few weeks after CMS's
    # quarterly PECOS enrollment refresh, so the file has settled.
    - cron: '0 14 20 1,4,7,10 *'
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Dry run (no writes to Supabase)'
        required: false
        default: 'false'

jobs:
  match:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install requests

      - name: Run Medicare match
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          DRY_RUN: ${{ github.event.inputs.dry_run || 'false' }}
        run: python scripts/medicare_match.py

      - name: Trigger Cloudflare Pages rebuild
        if: ${{ github.event.inputs.dry_run != 'true' }}
        run: curl -s -X POST "${{ secrets.CLOUDFLARE_DEPLOY_HOOK }}"
